name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tests
        run: npm test

      - name: Verify dist
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is not clean after build!"
            exit 1
          fi

      - name: Extract Major Tag
        id: major_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match semver format ^v[0-9]+\.[0-9]+\.[0-9]+$"
            exit 1
          fi
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Update Major Tag Pointer
        env:
          TAG: ${{ steps.major_tag.outputs.tag }}
          MAJOR: ${{ steps.major_tag.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.major_tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating release title..."
            gh release edit "$TAG" --title "Release $TAG"
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes
          fi
