name: Draft Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Target release tag (optional, e.g. v1.1.0)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  draft-release:
    name: Generate Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Tendr Release Drafting
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          features: release
          release-tag: ${{ inputs.release-tag || '' }}
          config-path: .github/tendr.yml
          dry-run: false
