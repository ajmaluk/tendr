<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="300" style="background:#0d1117;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="860" height="300" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="15" y="15" width="830" height="270" rx="8" fill="url(#grad1)"/>

  <!-- Top Bar -->
  <circle cx="35" cy="35" r="5" fill="#f87171"/>
  <circle cx="50" cy="35" r="5" fill="#fbbf24"/>
  <circle cx="65" cy="35" r="5" fill="#34d399"/>
  <text x="90" y="39" fill="#8b949e" font-size="12" font-weight="600">Tendr · Deterministic Maintainer Automation</text>

  <!-- Column 1: Issue Triage -->
  <g transform="translate(30, 65)">
    <rect width="250" height="200" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="28" fill="#58a6ff" font-size="13" font-weight="700">1. Issue Triage</text>
    <rect x="16" y="42" width="45" height="18" rx="4" fill="#d73a4a" fill-opacity="0.2"/>
    <text x="24" y="55" fill="#ff7b72" font-size="11" font-weight="600">bug</text>
    <rect x="68" y="42" width="75" height="18" rx="4" fill="#6e7681" fill-opacity="0.2"/>
    <text x="76" y="55" fill="#8b949e" font-size="11" font-weight="600">needs-info</text>
    
    <text x="16" y="90" fill="#c9d1d9" font-size="12" font-weight="600">Missing Information Check</text>
    <text x="16" y="112" fill="#7ee787" font-size="11">✓ Version: 1.0.0</text>
    <text x="16" y="130" fill="#7ee787" font-size="11">✓ Steps to reproduce</text>
    <text x="16" y="148" fill="#7ee787" font-size="11">✓ Expected vs Actual</text>
    
    <text x="16" y="180" fill="#8b949e" font-size="11">→ TF-IDF Duplicates: 0 found</text>
  </g>

  <!-- Column 2: PR Analysis -->
  <g transform="translate(305, 65)">
    <rect width="250" height="200" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="28" fill="#bc8cff" font-size="13" font-weight="700">2. PR Analysis Report</text>
    <rect x="16" y="42" width="55" height="18" rx="4" fill="#238636" fill-opacity="0.2"/>
    <text x="24" y="55" fill="#7ee787" font-size="11" font-weight="600">size/XS</text>
    <rect x="78" y="42" width="75" height="18" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="86" y="55" fill="#58a6ff" font-size="11" font-weight="600">area/.github</text>

    <text x="16" y="90" fill="#c9d1d9" font-size="12" font-weight="600">Changes: +12 / -4 lines</text>
    <text x="16" y="112" fill="#7ee787" font-size="11">✓ Tests: test suite updated</text>
    <text x="16" y="130" fill="#e3b341" font-size="11">⚠ Sensitive paths detected</text>
    <text x="16" y="148" fill="#7ee787" font-size="11">✓ Title: Conventional Commits</text>

    <text x="16" y="180" fill="#8b949e" font-size="11">Sticky idempotent comment</text>
  </g>

  <!-- Column 3: Release Drafting -->
  <g transform="translate(580, 65)">
    <rect width="250" height="200" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="28" fill="#7ee787" font-size="13" font-weight="700">3. Release Drafting</text>
    <rect x="16" y="42" width="50" height="18" rx="4" fill="#a371f7" fill-opacity="0.2"/>
    <text x="24" y="55" fill="#d2a8ff" font-size="11" font-weight="600">v1.0.0</text>
    <rect x="72" y="42" width="50" height="18" rx="4" fill="#238636" fill-opacity="0.2"/>
    <text x="80" y="55" fill="#7ee787" font-size="11" font-weight="600">draft</text>

    <text x="16" y="90" fill="#c9d1d9" font-size="12" font-weight="600">Grouped Release Notes</text>
    <text x="16" y="112" fill="#8b949e" font-size="11">• Breaking Changes (0)</text>
    <text x="16" y="130" fill="#8b949e" font-size="11">• Features &amp; Improvements</text>
    <text x="16" y="148" fill="#8b949e" font-size="11">• Bug Fixes &amp; Docs</text>

    <text x="16" y="180" fill="#8b949e" font-size="11">Semver bump calculated</text>
  </g>
</svg>
