<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="380" style="background:#0d1117;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <rect x="0" y="0" width="860" height="380" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="38" fill="#58a6ff" font-size="16" font-weight="700">Pull Request Analysis Engine</text>
  <text x="30" y="58" fill="#8b949e" font-size="12">Deterministic quality checks, size labeling, and sticky markdown reports</text>

  <!-- Step 1: PR Event -->
  <g transform="translate(30, 85)">
    <rect width="180" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="24" fill="#58a6ff" font-size="12" font-weight="700">1. PR Trigger</text>
    <text x="14" y="46" fill="#c9d1d9" font-size="11">pull_request</text>
    <text x="14" y="64" fill="#c9d1d9" font-size="11">pull_request_target</text>
    <text x="14" y="86" fill="#7ee787" font-size="10">Safe on forks (read-only API)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="210" y1="140" x2="250" y2="140" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="248,136 258,140 248,144" fill="#58a6ff"/>

  <!-- Step 2: Metric Calculations -->
  <g transform="translate(260, 85)">
    <rect width="220" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="24" fill="#a371f7" font-size="12" font-weight="700">2. Metric Calculation</text>
    <text x="14" y="46" fill="#c9d1d9" font-size="11">• Additions &amp; Deletions (+/-)</text>
    <text x="14" y="66" fill="#c9d1d9" font-size="11">• Size labels: size/XS to size/XL</text>
    <text x="14" y="86" fill="#c9d1d9" font-size="11">• Top-level area folder breakdown</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="480" y1="140" x2="520" y2="140" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="518,136 528,140 518,144" fill="#58a6ff"/>

  <!-- Step 3: Five Quality Checks -->
  <g transform="translate(530, 85)">
    <rect width="300" height="260" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="16" y="26" fill="#58a6ff" font-size="13" font-weight="700">3. Five Quality &amp; Safety Checks</text>
    
    <g transform="translate(16, 42)">
      <text x="0" y="14" fill="#e3b341" font-size="11" font-weight="600">🛡️ Tests Check</text>
      <text x="0" y="28" fill="#8b949e" font-size="10">Warns if source files changed without test files</text>
    </g>

    <g transform="translate(16, 84)">
      <text x="0" y="14" fill="#e3b341" font-size="11" font-weight="600">📖 Docs Check</text>
      <text x="0" y="28" fill="#8b949e" font-size="10">Warns if public APIs changed without documentation</text>
    </g>

    <g transform="translate(16, 126)">
      <text x="0" y="14" fill="#ff7b72" font-size="11" font-weight="600">⚠️ Risky Paths</text>
      <text x="0" y="28" fill="#8b949e" font-size="10">Flags auth, migrations, workflows, lockfiles</text>
    </g>

    <g transform="translate(16, 168)">
      <text x="0" y="14" fill="#7ee787" font-size="11" font-weight="600">✍️ Conventional Commits Title</text>
      <text x="0" y="28" fill="#8b949e" font-size="10">Verifies feat: / fix(scope): format</text>
    </g>

    <g transform="translate(16, 210)">
      <text x="0" y="14" fill="#79c0ff" font-size="11" font-weight="600">🔗 Linked Issue Reference</text>
      <text x="0" y="28" fill="#8b949e" font-size="10">Validates fixes #123 / closes #456</text>
    </g>
  </g>

  <!-- Output Box Below -->
  <g transform="translate(30, 230)">
    <rect width="450" height="115" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.2"/>
    <text x="16" y="26" fill="#7ee787" font-size="13" font-weight="700">4. Sticky PR Report &amp; Label Application</text>
    <text x="16" y="50" fill="#c9d1d9" font-size="11">✓ Posts or updates ONE single sticky comment (no duplicate noise)</text>
    <text x="16" y="70" fill="#c9d1d9" font-size="11">✓ Attaches current size label &amp; removes outdated size labels</text>
    <text x="16" y="90" fill="#c9d1d9" font-size="11">✓ Applies top-level area labels (e.g. area/src, area/docs)</text>
  </g>

  <!-- Connector from Checks to Output -->
  <path d="M 530,285 L 480,285" fill="none" stroke="#2ea043" stroke-width="2"/>
  <polygon points="484,281 474,285 484,289" fill="#2ea043"/>
</svg>
