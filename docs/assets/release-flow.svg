<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="380" style="background:#0d1117;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <rect x="0" y="0" width="860" height="380" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="38" fill="#d2a8ff" font-size="16" font-weight="700">Release Drafting Pipeline</text>
  <text x="30" y="58" fill="#8b949e" font-size="12">Automatic PR classification, semver bump suggestions, and draft release generation</text>

  <!-- Step 1: Trigger -->
  <g transform="translate(30, 90)">
    <rect width="160" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="24" fill="#a371f7" font-size="12" font-weight="700">1. Trigger</text>
    <text x="14" y="46" fill="#c9d1d9" font-size="11">workflow_dispatch</text>
    <text x="14" y="66" fill="#8b949e" font-size="11">or tag push (v*.*.*)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="137" x2="230" y2="137" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="228,133 238,137 228,141" fill="#d2a8ff"/>

  <!-- Step 2: Collector -->
  <g transform="translate(240, 90)">
    <rect width="170" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="24" fill="#58a6ff" font-size="12" font-weight="700">2. Collect PRs</text>
    <text x="14" y="46" fill="#c9d1d9" font-size="11">Find latest release tag</text>
    <text x="14" y="66" fill="#c9d1d9" font-size="11">Paginate merged PRs</text>
    <text x="14" y="84" fill="#8b949e" font-size="10">Chronological sort</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="410" y1="137" x2="450" y2="137" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="448,133 458,137 448,141" fill="#d2a8ff"/>

  <!-- Step 3: Classifier -->
  <g transform="translate(460, 90)">
    <rect width="180" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="24" fill="#7ee787" font-size="12" font-weight="700">3. Classify PRs</text>
    <text x="14" y="46" fill="#c9d1d9" font-size="11">1. Category labels</text>
    <text x="14" y="66" fill="#c9d1d9" font-size="11">2. Conventional types</text>
    <text x="14" y="84" fill="#8b949e" font-size="10">3. Other changes</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="640" y1="137" x2="680" y2="137" stroke="#d2a8ff" stroke-width="2"/>
  <polygon points="678,133 688,137 678,141" fill="#d2a8ff"/>

  <!-- Step 4: Semver Calculation -->
  <g transform="translate(690, 90)">
    <rect width="140" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="12" y="24" fill="#e3b341" font-size="12" font-weight="700">4. Semver Bump</text>
    <text x="12" y="46" fill="#ff7b72" font-size="11">Breaking → Major</text>
    <text x="12" y="66" fill="#58a6ff" font-size="11">feat → Minor</text>
    <text x="12" y="84" fill="#8b949e" font-size="11">fix → Patch</text>
  </g>

  <!-- Final Step: Draft Release Creation -->
  <g transform="translate(180, 230)">
    <rect width="500" height="115" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="20" y="28" fill="#d2a8ff" font-size="13" font-weight="700">5. Draft Release &amp; Release Notes Output</text>
    <text x="20" y="52" fill="#c9d1d9" font-size="11">• Formats grouped categories (Breaking, Features, Fixes, Docs, Maintenance)</text>
    <text x="20" y="72" fill="#c9d1d9" font-size="11">• Recognizes "New Contributors" with their first merged contribution</text>
    <text x="20" y="92" fill="#7ee787" font-size="11">🔒 Creates DRAFT GitHub Release (Never publishes automatically. Maintainer in control.)</text>
  </g>

  <!-- Connector from Semver to Output -->
  <path d="M 760,185 L 760,285 L 680,285" fill="none" stroke="#a371f7" stroke-width="2"/>
  <polygon points="684,281 674,285 684,289" fill="#a371f7"/>
</svg>
