<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" height="400" style="background:#0d1117;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <rect x="0" y="0" width="860" height="400" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="38" fill="#58a6ff" font-size="16" font-weight="700">Issue Triage &amp; Lifecycle Flow</text>
  <text x="30" y="58" fill="#8b949e" font-size="12">How Tendr processes, checks, and guides new and edited issues</text>

  <!-- Step 1: Issue Event -->
  <g transform="translate(30, 85)">
    <rect width="160" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="26" fill="#7ee787" font-size="12" font-weight="700">1. Issue Event</text>
    <text x="14" y="48" fill="#c9d1d9" font-size="11">issues: opened</text>
    <text x="14" y="66" fill="#8b949e" font-size="11">or issues: edited</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="130" x2="230" y2="130" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="228,126 238,130 228,134" fill="#58a6ff"/>

  <!-- Step 2: Auto Labeling -->
  <g transform="translate(240, 85)">
    <rect width="170" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="26" fill="#58a6ff" font-size="12" font-weight="700">2. Auto-Labeler</text>
    <text x="14" y="48" fill="#c9d1d9" font-size="11">Keywords &amp; Regex</text>
    <text x="14" y="68" fill="#ff7b72" font-size="11">+ bug, + question</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="410" y1="130" x2="450" y2="130" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="448,126 458,130 448,134" fill="#58a6ff"/>

  <!-- Step 3: Required Info Decision -->
  <g transform="translate(460, 85)">
    <rect width="180" height="90" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="14" y="26" fill="#e3b341" font-size="12" font-weight="700">3. Required Info Check</text>
    <text x="14" y="48" fill="#c9d1d9" font-size="11">Headings &amp; Forms</text>
    <text x="14" y="68" fill="#8b949e" font-size="10">Checks placeholder text</text>
  </g>

  <!-- Branch: Missing Info -->
  <line x1="550" y1="175" x2="550" y2="230" stroke="#f85149" stroke-width="2"/>
  <polygon points="546,228 550,238 554,228" fill="#f85149"/>

  <g transform="translate(430, 240)">
    <rect width="240" height="110" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1"/>
    <text x="14" y="24" fill="#ff7b72" font-size="12" font-weight="700">Missing Required Details</text>
    <text x="14" y="44" fill="#c9d1d9" font-size="11">• Post sticky warning comment</text>
    <text x="14" y="64" fill="#c9d1d9" font-size="11">• Attach needs-info label</text>
    <text x="14" y="92" fill="#7ee787" font-size="11">🔄 User edits → auto resolves!</text>
  </g>

  <!-- Arrow 3 -> 4 (Passed) -->
  <line x1="640" y1="130" x2="680" y2="130" stroke="#2ea043" stroke-width="2"/>
  <polygon points="678,126 688,130 678,134" fill="#2ea043"/>

  <!-- Step 4: Duplicate Detection -->
  <g transform="translate(690, 85)">
    <rect width="140" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="12" y="26" fill="#bc8cff" font-size="12" font-weight="700">4. TF-IDF Scan</text>
    <text x="12" y="48" fill="#c9d1d9" font-size="11">Cosine Similarity</text>
    <text x="12" y="68" fill="#8b949e" font-size="10">Flags &gt;0.55 match</text>
  </g>

  <!-- Resolved Loop Back arrow -->
  <path d="M 430,295 L 110,295 L 110,185" fill="none" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="4"/>
  <polygon points="106,188 110,178 114,188" fill="#2ea043"/>
  <text x="130" y="325" fill="#7ee787" font-size="11">Reporter edits issue description with version/steps</text>
</svg>
